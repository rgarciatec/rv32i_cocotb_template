<text x="820" y="730" text-anchor="start" class="s">dmem_ready</text>
<line x1="430" y1="762" x2="810" y2="762" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="543.6" y="743" width="152.8" height="17" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="620" y="756" text-anchor="middle" class="s">dmem_rdata [31:0]</text>
<text x="820" y="766" text-anchor="start" class="s">dmem_rdata</text>
<rect x="442.0" y="797" width="356.0" height="72" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="620" y="815" text-anchor="middle" class="h" font-size="13">Status interface</text>
<line x1="810" y1="851" x2="430" y2="851" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="518.4" y="832" width="203.2" height="17" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="620" y="845" text-anchor="middle" class="s">illegal_instruction (1)</text>
<text x="820" y="855" text-anchor="start" class="s">illegal_instruction</text>
<rect x="120.0" y="940" width="960.0" height="62" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="600" y="966" text-anchor="middle" class="h" font-size="15">Harvard: separate instruction and data memory interfaces</text>
<text x="600" y="990" text-anchor="middle" class="b">Fetch uses imem_* only; lw and sw use dmem_* only. Each side has its own valid/ready handshake.</text>
</svg>
